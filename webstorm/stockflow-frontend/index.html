<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>StockFlow · Inventario</title>
    <script>
      // Aplica el tema guardado ANTES del primer pintado para evitar un destello claro en modo oscuro.
      // Misma clave y lógica que src/app/theme/ThemeProvider.tsx.
      (function () {
        var t = null;
        try { t = localStorage.getItem('stockflow.theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
