# G10 (secciones 19 y 20): servidor estático para dist/ en producción.
# - Fallback SPA: /productos no existe como archivo; se devuelve index.html y React Router resuelve la ruta.
# - /api/ se reenvía al backend: el navegador ve un solo origen, así que .env.production usa VITE_API_URL=/api
#   y no hace falta un dominio aparte para la API.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # shortcut: "backend" es el nombre del servicio Spring Boot en Docker Compose; cámbialo si se despliega en otro host.
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;   # con puerto: Spring compara Origin con el Host para decidir si es CORS
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
