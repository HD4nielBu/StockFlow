$kind: http-request
name: "[400] Campos obligatorios vacíos"
url: "{{baseUrl}}/api/categorias"
method: POST
headers:
  Content-Type: "application/json"
  Accept: "application/json"
body:
  type: json
  content: |-
    {
      "codigo": "",
      "nombre": ""
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 400", () => pm.response.to.have.status(400));
      pm.test("Formato ApiErrorResponse", () => {
          const e = pm.response.json();
          pm.expect(e.status).to.eql(400);
          pm.expect(e).to.have.property("message");
          pm.expect(e).to.have.property("path");
      });
      pm.test("Error en el campo codigo", () => pm.expect(pm.response.json().fieldErrors).to.have.property("codigo"));
      pm.test("Error en el campo nombre", () => pm.expect(pm.response.json().fieldErrors).to.have.property("nombre"));
    language: text/javascript
order: 2000
