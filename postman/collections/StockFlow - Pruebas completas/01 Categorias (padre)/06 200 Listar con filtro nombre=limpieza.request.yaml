$kind: http-request
name: "[200] Listar con filtro ?nombre=limpieza"
url: "{{baseUrl}}/api/categorias?nombre=limpieza"
method: GET
headers:
  Accept: "application/json"
queryParams:
  nombre: "limpieza"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", () => pm.response.to.have.status(200));
      pm.test("Devuelve una lista", () => pm.expect(pm.response.json()).to.be.an("array"));
      pm.test("Al menos 1 elementos", () => pm.expect(pm.response.json().length).to.be.at.least(1));
    language: text/javascript
order: 6000
