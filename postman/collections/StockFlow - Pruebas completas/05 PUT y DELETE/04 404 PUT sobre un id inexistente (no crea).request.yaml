$kind: http-request
name: "[404] PUT sobre un id inexistente (no crea)"
url: "{{baseUrl}}/api/categorias/9999"
method: PUT
headers:
  Content-Type: "application/json"
  Accept: "application/json"
body:
  type: json
  content: |-
    {
      "codigo": "CAT-NO-CREAR",
      "nombre": "No debe crearse",
      "activo": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 404", () => pm.response.to.have.status(404));
      pm.test("Formato ApiErrorResponse", () => {
          const e = pm.response.json();
          pm.expect(e.status).to.eql(404);
          pm.expect(e).to.have.property("message");
          pm.expect(e).to.have.property("path");
      });
    language: text/javascript
order: 4000
