$kind: http-request
name: "[204] DELETE del producto creado"
url: "{{baseUrl}}/api/productos/{{productoId}}"
method: DELETE
headers:
  Accept: "application/json"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 204", () => pm.response.to.have.status(204));
      pm.test("Sin cuerpo", () => pm.expect(pm.response.text()).to.eql(""));
    language: text/javascript
order: 13000
