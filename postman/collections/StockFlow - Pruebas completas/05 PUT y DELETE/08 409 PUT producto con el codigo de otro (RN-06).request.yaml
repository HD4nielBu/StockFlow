$kind: http-request
name: "[409] PUT producto con el código de otro (RN-06)"
url: "{{baseUrl}}/api/productos/{{productoId}}"
method: PUT
headers:
  Content-Type: "application/json"
  Accept: "application/json"
body:
  type: json
  content: |-
    {
      "categoriaId": 2,
      "codigo": "PRD-OFI-001",
      "nombre": "Cuaderno",
      "unidadMedida": "UNIDAD",
      "stockMinimoDefault": 25,
      "activo": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 409", () => pm.response.to.have.status(409));
      pm.test("Formato ApiErrorResponse", () => {
          const e = pm.response.json();
          pm.expect(e.status).to.eql(409);
          pm.expect(e).to.have.property("message");
          pm.expect(e).to.have.property("path");
      });
    language: text/javascript
order: 8000
