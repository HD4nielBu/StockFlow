$kind: http-request
name: "[404] Productos de una categoría inexistente"
url: "{{baseUrl}}/api/productos/categoria/9999"
method: GET
headers:
  Accept: "application/json"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 404", () => pm.response.to.have.status(404));
      pm.test("Formato ApiErrorResponse", () => {
          const e = pm.response.json();
          pm.expect(e.status).to.eql(404);
          pm.expect(e).to.have.property("message");
          pm.expect(e).to.have.property("path");
      });
    language: text/javascript
order: 9000
