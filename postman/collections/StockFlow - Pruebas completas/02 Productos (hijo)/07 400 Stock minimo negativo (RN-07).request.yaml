$kind: http-request
name: "[400] Stock mínimo negativo (RN-07)"
url: "{{baseUrl}}/api/productos"
method: POST
headers:
  Content-Type: "application/json"
  Accept: "application/json"
body:
  type: json
  content: |-
    {
      "categoriaId": 1,
      "codigo": "PRD-X-401",
      "nombre": "Mínimo negativo",
      "stockMinimoDefault": -5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 400", () => pm.response.to.have.status(400));
      pm.test("Formato ApiErrorResponse", () => {
          const e = pm.response.json();
          pm.expect(e.status).to.eql(400);
          pm.expect(e).to.have.property("message");
          pm.expect(e).to.have.property("path");
      });
      pm.test("Error en el campo stockMinimoDefault", () => pm.expect(pm.response.json().fieldErrors).to.have.property("stockMinimoDefault"));
    language: text/javascript
order: 7000
