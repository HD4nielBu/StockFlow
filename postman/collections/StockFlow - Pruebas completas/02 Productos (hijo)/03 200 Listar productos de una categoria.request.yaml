$kind: http-request
name: "[200] Listar productos de una categoría"
url: "{{baseUrl}}/api/productos/categoria/1"
method: GET
headers:
  Accept: "application/json"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", () => pm.response.to.have.status(200));
      pm.test("Devuelve una lista", () => pm.expect(pm.response.json()).to.be.an("array"));
      pm.test("Al menos 2 elementos", () => pm.expect(pm.response.json().length).to.be.at.least(2));
    language: text/javascript
order: 3000
