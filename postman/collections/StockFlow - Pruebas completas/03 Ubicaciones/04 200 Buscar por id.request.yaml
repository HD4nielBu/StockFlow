$kind: http-request
name: "[200] Buscar por id"
url: "{{baseUrl}}/api/ubicaciones/1"
method: GET
headers:
  Accept: "application/json"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", () => pm.response.to.have.status(200));
      pm.test("Es el almacén central", () => pm.expect(pm.response.json().tipo).to.eql("ALMACEN_CENTRAL"));
    language: text/javascript
order: 4000
