$kind: http-request
name: "[200] Listar ubicaciones"
url: "{{baseUrl}}/api/ubicaciones"
method: GET
headers:
  Accept: "application/json"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", () => pm.response.to.have.status(200));
      pm.test("Devuelve una lista", () => pm.expect(pm.response.json()).to.be.an("array"));
      pm.test("Al menos 3 elementos", () => pm.expect(pm.response.json().length).to.be.at.least(3));
    language: text/javascript
order: 1000
