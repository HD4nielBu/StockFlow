$kind: http-request
name: "[400] Página no numérica"
url: "{{baseUrl}}/api/inventario/kardex/1?pagina=abc"
method: GET
headers:
  Accept: "application/json"
queryParams:
  pagina: "abc"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 400", () => pm.response.to.have.status(400));
      pm.test("Formato ApiErrorResponse", () => {
          const e = pm.response.json();
          pm.expect(e.status).to.eql(400);
          pm.expect(e).to.have.property("message");
          pm.expect(e).to.have.property("path");
      });
    language: text/javascript
order: 10000
