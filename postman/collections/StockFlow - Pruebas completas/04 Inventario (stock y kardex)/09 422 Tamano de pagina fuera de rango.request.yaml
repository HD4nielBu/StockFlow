$kind: http-request
name: "[422] Tamaño de página fuera de rango"
url: "{{baseUrl}}/api/inventario/kardex/1?tamano=500"
method: GET
headers:
  Accept: "application/json"
queryParams:
  tamano: "500"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 422", () => pm.response.to.have.status(422));
      pm.test("Formato ApiErrorResponse", () => {
          const e = pm.response.json();
          pm.expect(e.status).to.eql(422);
          pm.expect(e).to.have.property("message");
          pm.expect(e).to.have.property("path");
      });
    language: text/javascript
order: 9000
